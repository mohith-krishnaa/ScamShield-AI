name: ScamShield checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-train:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Train model and generate held-out evaluation
        run: python train_model.py
      - name: Compare baseline classifiers
        run: python evaluate_models.py
      - name: Verify generated model and evaluation output
        run: python -c "from pathlib import Path; assert Path('models/scamshield_model.joblib').is_file(); assert Path('models/evaluation.json').is_file(); print('Model and evaluation artifacts generated successfully.')"
